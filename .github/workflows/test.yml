name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  GIT_COMMIT: ${{ github.sha }}
  GIT_REF: ${{ github.ref }}
  GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
  LOG_LEVEL: info
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  # The oldest supported LTS version
  STABLE_NODE_VERSION: 22

jobs:
  complete:
    name: Test completion check
    if: always()

    permissions:
      contents: none

    runs-on: ubuntu-latest
    needs:
      - test
      - test-alpine
      - lint
      - format
      - examples
      - regression

    steps:
      - name: Failed
        run: exit 1
        if: >
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')

  # TEMPORARY (revert before merge): builds @pact-foundation/pact-core from
  # YOU54F/pact-js-core feat/or-matcher, whose CI prebuilds the native addon against the
  # pact_ffi 0.5.13-or.1 prerelease from YOU54F/pact-reference, and hands the
  # JS build plus those prebuilds to the test jobs.
  pact-core-rc:
    name: Fetch pact-core build (pact_ffi rc)
    runs-on: ubuntu-latest
    env:
      PACT_CORE_REPO: YOU54F/pact-js-core
      PACT_CORE_BRANCH: feat/or-matcher
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Find the latest pact-js-core run with prebuilds
        id: run
        run: |
          run_id=$(gh run list --repo "$PACT_CORE_REPO" --branch "$PACT_CORE_BRANCH" \
            --workflow build-and-test.yml --event pull_request \
            --json databaseId,headSha -L 1 -q '.[0].databaseId')
          sha=$(gh run view "$run_id" --repo "$PACT_CORE_REPO" --json headSha -q .headSha)
          echo "Using $PACT_CORE_REPO run $run_id at $sha"
          echo "id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pact-js-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.PACT_CORE_REPO }}
          ref: ${{ steps.run.outputs.sha }}
          path: pact-js-core

      - name: Setup Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.STABLE_NODE_VERSION }}

      - name: Build pact-core JS
        working-directory: pact-js-core
        run: |
          npm ci --ignore-scripts
          npm run build
          grep -n "PACT_FFI_VERSION =" src/ffi/index.ts

      - name: Assemble pact-core with prebuilds
        run: |
          gh run download "${{ steps.run.outputs.id }}" --repo "$PACT_CORE_REPO" -p 'artifact-*' -D artifacts
          mkdir -p pact-core-rc
          cp -R pact-js-core/dist pact-core-rc/dist
          for f in artifacts/*/*.tar.gz; do tar -xzf "$f" -C pact-core-rc; done
          find pact-core-rc/prebuilds -type f

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pact-core-rc
          path: pact-core-rc
          if-no-files-found: error

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - run: npm ci
      - run: npm run format

  regression:
    name: Run regression suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.STABLE_NODE_VERSION }}
          cache: npm

      - name: Install root dependencies
        run: npm ci
      - name: Install regression dependencies
        run: npm ci
        working-directory: regression

      - run: npm run test
        working-directory: regression

  test:
    name: >-
      Test
      on ${{ matrix.os }}
      with Node ${{ matrix.node-version }}

    runs-on: ${{ matrix.os }}
    needs: [pact-core-rc]

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        os:
          - macos-26-intel
          - macos-latest
          - ubuntu-24.04-arm
          - ubuntu-latest
          - windows-latest
          # - windows-11-arm  # Disable until pact-js-core supports it

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pact-core-rc
          path: pact-core-rc
      - name: Use pact-core build with pact_ffi rc (revert before merge)
        shell: bash
        run: |
          rm -rf node_modules/@pact-foundation/pact-core/dist
          cp -R pact-core-rc/dist node_modules/@pact-foundation/pact-core/dist
          echo "PACT_PREBUILD_LOCATION=$(node -p "require('path').resolve('pact-core-rc')")" >> "$GITHUB_ENV"
      - name: Check the loaded pact_ffi version
        shell: bash
        run: node -e "const v=require('@pact-foundation/pact-core').getFfiLib('info').pactffiVersion(); console.log('pact_ffi', v); if (v !== '0.5.13-or.1') process.exit(1)"
      - run: npm test
        shell: bash

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node-version == env.STABLE_NODE_VERSION
        with:
          report_type: coverage
          token: ${{ secrets.CODECOV_TOKEN }}
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: always() && matrix.node-version == env.STABLE_NODE_VERSION
        with:
          report_type: test_results
          token: ${{ secrets.CODECOV_TOKEN }}





  test-alpine:
    name: >-
      Test Alpine
      with Node ${{ matrix.node-version }}

    runs-on: ubuntu-latest
    needs: [pact-core-rc]
    container:
      image: node:${{ matrix.node-version }}-alpine

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pact-core-rc
          path: pact-core-rc
      - name: Use pact-core build with pact_ffi rc (revert before merge)
        run: |
          rm -rf node_modules/@pact-foundation/pact-core/dist
          cp -R pact-core-rc/dist node_modules/@pact-foundation/pact-core/dist
          echo "PACT_PREBUILD_LOCATION=$(node -p "require('path').resolve('pact-core-rc')")" >> "$GITHUB_ENV"
      - name: Check the loaded pact_ffi version
        run: node -e "const v=require('@pact-foundation/pact-core').getFfiLib('info').pactffiVersion(); console.log('pact_ffi', v); if (v !== '0.5.13-or.1') process.exit(1)"
      - run: npm test

  examples:
    name: Test Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.JS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.STABLE_NODE_VERSION }}
          cache: npm

      - run: npm run install-plugins
      - name: Install root dependencies
        run: npm ci

      - name: Install and test examples
        run: |
          error_file=$(mktemp)
          find examples \
            -maxdepth 2 \
            -name package.json \
            -not -path '*/node_modules/*' \
            -print0 | while IFS= read -r -d '' dir; do
            pushd "$(dirname "$dir")" > /dev/null
            echo "::group::$PWD"
            if ! npm ci; then
              echo "npm ci failed in $PWD" >> "$error_file"
            fi
            if ! npm run test; then
              echo "npm run test failed in $PWD" >> "$error_file"
            fi
            echo "::endgroup::"
            popd > /dev/null
          done
          if [ -s "$error_file" ]; then
            echo "::error::Examples test failures occurred"
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$error_file"
            rm "$error_file"
            exit 1
          fi
